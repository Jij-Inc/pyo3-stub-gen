name: "Setup Test Environment"
description: "Setup common environment for testing jobs"

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.10"

runs:
  using: "composite"
  steps:
    - name: Install Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ github.token }}

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt, clippy

    - name: Setup caching for Rust
      uses: Swatinem/rust-cache@v2

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.12.21"
        python-version: ${{ inputs.python-version }}
        activate-environment: true

    - name: Configure PyO3 interpreter
      shell: bash
      run: |
        python_path="$(uv python find --no-project --resolve-links '${{ inputs.python-version }}')"
        echo "PYO3_PYTHON=$python_path" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=${python_path%/bin/*}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
