# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  stub-gen:
    desc: Generate stub file
    cmds:
      - cargo run --bin stub_gen

  test:
    desc: Run tests
    cmds:
      - uv run --dev pyright
      - uv run --dev ruff check
      - uv run --dev mypy --show-error-codes -p type_statement_alias
      - uv run --dev stubtest type_statement_alias --ignore-missing-stub --ignore-disjoint-bases --allowlist .stubtest-allowlist
      - uv run --dev pyrefly check ./type_statement_alias.pyi
      - uv run --dev ty check .
