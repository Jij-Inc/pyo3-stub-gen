# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  doc:
    taskfile: ../doc.yml
    flatten: true
    dir: .

tasks:
  stub-gen:
    desc: Generate stub file
    cmds:
      - cargo run --bin stub_gen

  test:
    desc: Run tests
    cmds:
      - uv sync --locked --project ../..
      - uv run --locked --project ../.. pytest
      - uv run --locked --project ../.. pyright
      - uv run --locked --project ../.. ruff check
      - uv run --locked --project ../.. mypy --show-error-codes -p generate_init_py
      # stubtest is disabled for this example due to PyO3 nested submodule limitations
      # See README.md for details
      - uv run --locked --project ../.. pyrefly check python
      - uv run --locked --project ../.. ty check python
