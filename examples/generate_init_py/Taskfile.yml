# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  doc:
    taskfile: ../doc.yml
    flatten: true
    dir: .

tasks:
  stub-gen:
    desc: Generate stub file
    cmds:
      - cargo run --bin stub_gen

  test:
    desc: Run tests
    cmds:
      - uv run --dev pytest
      - uv run --dev pyright
      - uv run --dev ruff check
      - uv run --dev mypy --show-error-codes -p generate_init_py
      # stubtest is disabled for this example due to PyO3 nested submodule limitations
      # See README.md for details
      - uv run --dev pyrefly check python
      - uv run --dev ty check python
