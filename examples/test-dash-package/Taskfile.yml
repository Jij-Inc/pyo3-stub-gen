# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  stub-gen:
    desc: Generate stub file
    cmds:
      - cargo run --bin stub_gen

  test:
    desc: Run tests
    cmds:
      - uv run --locked --project ../.. pytest
      - uv run --locked --project ../.. pyright
      - uv run --locked --project ../.. ruff check
      - uv run --locked --project ../.. mypy --show-error-codes -p test_dash_package
      - uv run --locked --project ../.. stubtest test_dash_package --ignore-missing-stub --ignore-disjoint-bases
      - uv run --locked --project ../.. pyrefly check -- .
      - uv run --locked --project ../.. ty check .
