# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  doc:
    taskfile: ../doc.yml
    flatten: true
    dir: .

tasks:
  stub-gen:
    desc: Generate stub file
    cmds:
      - cargo run --bin stub_gen

  test:
    desc: Run tests
    cmds:
      - uv run --dev pytest
      - uv run --dev pyright
      - uv run --dev ruff check
      - uv run --dev mypy --show-error-codes -p pure
      - uv run --dev stubtest pure --ignore-missing-stub --ignore-disjoint-bases --allowlist .stubtest-allowlist
      - uv run --dev pyrefly check ./pure.pyi
      - uv run --dev ty check .
